<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遊戲王卡片查詢</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>遊戲王卡片查詢</h1>
  <span class="db-info" id="dbInfo"></span>
</header>

<div class="layout">
  <!-- 左側常駐條件側欄:邊看結果邊調條件,不必來回捲動。
       後面幾張票的條件軸(效果文、卡片參數、效果類型)各自往這裡加一段。 -->
  <aside class="sidebar" id="sidebar">
    <!-- 摺疊鈕只在窄螢幕出現(桌機由 CSS 收起來):手機一屏只有 600 多點高,
         常駐的條件區會把結果整個推到摺線以下。摺起來看不見條件,所以鈕面上寫著
         目前有幾條條件在生效——帶條件的網址在手機上一開就是摺著的,不寫的話
         使用者看到的是一批被篩過、卻沒有任何理由的結果。 -->
    <button type="button" id="btnFilters" class="sidebar-toggle"
            aria-expanded="false" aria-controls="sidebarBody">篩選條件</button>

    <div class="sidebar-body" id="sidebarBody">
    <div class="sidebar-actions">
      <button type="button" id="btnSearch" class="primary">搜尋</button>
      <button type="button" id="btnClear">清除條件</button>
    </div>

    <div class="crit">
      <div class="field">
        <span class="field-label">卡片密碼</span>
        <input type="text" id="fId" inputmode="numeric"
               placeholder="例：46986414">
        <p class="field-hint">完全相等才算；異圖密碼查得到本尊</p>
      </div>

      <div class="field">
        <span class="field-label">卡名</span>
        <div class="name-row">
          <!-- 語言三態循環鈕:中 → 日 → 英 → 中。標籤與比對語言由 query.js 一處
               決定,HTML 只給起始態。 -->
          <button type="button" id="fNameLang" class="lang-cycle" data-v="zh"
                  title="切換卡名比對語言">中</button>
          <input type="text" id="fName"
                 placeholder="例：青眼%龍">
        </div>
      </div>

      <div class="field">
        <span class="field-label">效果文</span>
        <input type="text" id="fText"
               placeholder="例：墓地%手牌">
        <label class="mat-toggle"
               title="不勾時素材指定行不掃：搜「融合」不會被融合怪獸的素材寫法淹沒">
          <input type="checkbox" id="fTextMat">素材指定行也一起搜
        </label>
        <p class="field-hint">同一個效果裡同時出現才算</p>
      </div>
    </div>

    <!-- 空殼容器:條件軸的按鈕與範圍全部由 window.VOCAB 生成(ADR-0008)。
         種族有幾個、效果類型有幾種,HTML 一個字都不知道——在值域正典裡加一個種族,
         這裡自動多一顆鈕。手抄一份選項在這裡的話,漏掉的那一批卡就點不出來。
         排列順序由 query.js 的 FIELDS 決定:大類(連同巢狀其下的子類型與怪獸
         參數)排在最前面,效果類型與必發/選發緊接其後——後兩者與上面的效果文框
         是全部的句層條件,並用時取同一個效果句。 -->
    <div class="crit" id="critParams"></div>
    </div><!-- /.sidebar-body -->
  </aside>

  <main class="results-area">
    <div class="actions">
      <span class="result-info" id="resultInfo"></span>
      <span class="spacer"></span>
      <!-- 排序不是查詢條件:換一個排序鍵只重排已經有的那份結果,不重跑搜尋。
           選項由 sort.js 的 KEYS 生成——加一個排序鍵時不必記得回來改 HTML。 -->
      <label class="sort">排序
        <select id="sortKey"></select>
      </label>
      <button type="button" id="sortDir" class="sort-dir"></button>
      <label class="per-page">每頁
        <select id="perPage">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
        筆</label>
    </div>

    <div class="pager" id="pagerTop"></div>
    <div id="results"></div>
    <div class="pager" id="pagerBottom"></div>
  </main>
</div>

<!-- 頁尾聲明三行:資料更新一行、來源一行、免責一行(2026-08-21 使用者裁示)。
     靜態文案住 HTML;唯一動態的是第一行的資料更新時間——值來自 META,由
     main.js 填入,META 沒有該欄位(建置機從未跑過更新流程)時整行維持 hidden。
     時間未知就不顯示,不顯示錯的。 -->
<footer class="site-footer">
  <p id="dataUpdated" hidden></p>
  <p>資料來源：查牌網（中文卡文・卡圖）・ygopro-database（日英卡名）・Master Duel Meta（MD 稀有度）・YGOPRODeck（Genesys 點數）・Yu-Gi-Oh! Neuron（效果類型）</p>
  <p>「遊戲王」為 KONAMI 之著作權與商標,本站為非官方查詢工具</p>
</footer>

<!-- 零建置協定(ADR-0007):沒有 bundler、沒有 ES modules,<script> 依序載入,
     模組是掛在全域的 IIFE 閉包。索引是 window.CARD_DATA=… 的 .js 而不是 .json,
     因為 file:// 下 fetch 會被 CORS 擋而 <script src> 不會。
     順序即相依:資料 → 工具 → 排序 → 引擎 → 輸入 → 網址 → 呈現 → 主流程。 -->
<script src="data.js"></script>
<script src="js/util.js"></script>
<script src="js/sort.js"></script>
<script src="js/engine.js"></script>
<script src="js/query.js"></script>
<script src="js/hash.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
